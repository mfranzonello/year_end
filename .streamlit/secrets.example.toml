# Streamlit deployment secrets. Duplicate the matching values from the local
# secret file intentionally; this deployment receives only what it consumes.

[postgresql]
host = ""
port = ""
database = ""
user = ""
password = ""

[cloudinary]
cloud_name = ""

# Default OpenID Connect provider used by st.login(). For Google, use the
# metadata URL below and create separate OAuth clients/redirect URIs for local
# and deployed environments.
[auth]
redirect_uri = "http://localhost:8501/oauth2callback"
cookie_secret = ""
client_id = ""
client_secret = ""
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

# Add the stable `sub` claim shown after the owner signs in. Do not authorize by
# email address because email is mutable and is not the provider's identity key.
[authorization]
admin_subjects = []
